name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          # 32-bit x86 (iSH on iOS and the like). Built natively in a 32-bit
          # Alpine container: no 32-bit musl C toolchain on the runner, and
          # `+crt-static` gives a binary with no libgcc/libc dependency.
          - target: i686-unknown-linux-musl
            os: ubuntu-24.04
            alpine32: true
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        run: |
          cd web
          npm ci --ignore-scripts
          npm run build

      - name: Set up Rust
        if: ${{ !matrix.alpine32 }}
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry/build
        if: ${{ !matrix.alpine32 }}
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        if: ${{ !matrix.alpine32 }}
        run: cargo build --locked --workspace --release --target ${{ matrix.target }} -p meshfox-cli

      - name: Build release binary (32-bit Alpine)
        if: ${{ matrix.alpine32 }}
        run: |
          set -euo pipefail
          # `--target` = the container's own triple, so `+crt-static` applies
          # to the binary but not to build scripts and proc-macros (a static
          # musl host can't load those). The 64-bit time_t flag matches musl
          # 1.2+ (see the libc crate's `musl_v1_2_3`). meshfox-server is built
          # at opt-level=1: at 3, rustc dies there with SIGFPE on 32-bit x86
          # (seen under emulation; the CI run for v0.28.1 failed in this step).
          docker run --rm --platform linux/386 -v "$PWD":/src -w /src \
            -e RUST_LIBC_UNSTABLE_MUSL_V1_2_3=1 \
            -e RUSTFLAGS="-C target-feature=+crt-static" \
            -e CARGO_TARGET_DIR=/src/target/build \
            alpine:3 sh -euc '
              apk add --no-cache rust cargo rustfmt build-base perl cmake
              host="$(rustc -vV | sed -n "s/^host: //p")"
              cargo build --locked --release -p meshfox-cli --target "$host" \
                --config "profile.release.package.meshfox-server.opt-level=1"
              mkdir -p "target/${{ matrix.target }}/release"
              cp "target/build/$host/release/meshfox" "target/${{ matrix.target }}/release/meshfox"
            '
          # A bare Alpine (no libgcc) must be able to run it.
          docker run --rm --platform linux/386 -v "$PWD/target/${{ matrix.target }}/release":/bin-under-test:ro \
            alpine:3 /bin-under-test/meshfox --version

      - name: Package binary
        run: |
          set -euo pipefail
          # The staging dir's name becomes the path prefix inside the
          # tarball, so it must be exactly the target triple — that's what
          # `meshfox check-updates` (self_update's default target
          # matching, get_target()) expects to find the binary under.
          staging="${{ matrix.target }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/meshfox" "$staging/"
          cp README.md LICENSE "$staging/"
          tar czf "meshfox-${{ matrix.target }}.tar.gz" "$staging"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: meshfox-${{ matrix.target }}
          path: meshfox-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Package Claude skills
        run: |
          set -euo pipefail
          # Same layout as the "Build the zip" block in
          # skills/summary-to-canvas/README.canvas.md: claude.ai wants the
          # skill folder at the archive's top level.
          cd skills
          zip -X ../summary-to-canvas.zip \
            summary-to-canvas/SKILL.md \
            summary-to-canvas/example.canvas.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*/*.tar.gz
            summary-to-canvas.zip
          draft: false
          generate_release_notes: true

  image:
    needs: release
    uses: ./.github/workflows/docker.yml
    with:
      tag: ${{ github.ref_name }}
    permissions:
      contents: read
      packages: write

  update-homebrew:
    needs: release
    uses: ./.github/workflows/homebrew.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
