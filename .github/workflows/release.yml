name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        run: |
          cd web
          npm ci --ignore-scripts
          npm run build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry/build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --workspace --release --target ${{ matrix.target }} -p meshfox-cli

      - name: Package binary
        run: |
          set -euo pipefail
          # The staging dir's name becomes the path prefix inside the
          # tarball, so it must be exactly the target triple — that's what
          # `meshfox check-updates` (self_update's default target
          # matching, get_target()) expects to find the binary under.
          staging="${{ matrix.target }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/meshfox" "$staging/"
          cp README.md LICENSE "$staging/"
          tar czf "meshfox-${{ matrix.target }}.tar.gz" "$staging"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: meshfox-${{ matrix.target }}
          path: meshfox-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*/*.tar.gz
          draft: false
          generate_release_notes: true
