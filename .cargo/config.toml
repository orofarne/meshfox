# On macOS, ld64's ad-hoc linker signature on a freshly built binary is
# flaky under AMFI (silent kill, or a long hang while AMFI/trustd validate
# it) — see scripts/run-signed.sh and the repo memory note
# "macos-codesign-kill". This (re-)signs a binary that isn't cleanly ad-hoc
# signed yet before every `cargo run`/`cargo test` exec, workspace-wide — one
# runner at a time, so parallel starts don't rewrite it under each other.
[target.'cfg(target_os = "macos")']
runner = "scripts/run-signed.sh"

# Backstop for every `cargo test`/`cargo run` (and so for every test that
# spawns a worker or the binary): never reach for the developer's shared
# coordinator/daemon. `server_socket` in `~/.meshfox/config.toml` would
# otherwise reroute a test through the real daemon (see the tests' own
# `HOME` isolation; this covers whatever one of them forgets). Empty means
# "off" (`meshfox_core::config::server_socket`). Not forced: a developer can
# still point a hand-run `cargo run` at their daemon with
# `MESHFOX_SERVER_SOCKET=<sock> cargo run ...`.
[env]
MESHFOX_SERVER_SOCKET = ""
