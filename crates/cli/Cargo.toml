[package]
name = "meshfox-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "meshfox"
path = "src/main.rs"

[dependencies]
meshfox-core = { path = "../core" }
meshfox-server = { path = "../server" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
rpassword = "7"
tera = "1"

[dev-dependencies]
scraper = "0.20"
