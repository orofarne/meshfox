[package]
name = "meshfox-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "meshfox"
path = "src/main.rs"

[dependencies]
meshfox-core = { path = "../core" }
meshfox-server = { path = "../server" }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "process", "io-util"] }
rpassword = "7"
tera = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
# Pinned to match what ratatui 0.30.2 itself already pulls transitively
# (via ratatui-crossterm) and what `edtui` (see below) depends on directly
# — keeping this at 0.28.x would mean two distinct, mutually-incompatible
# `crossterm::event::KeyEvent` types in the same binary (edtui's own
# `Into<KeyInput>` conversion is only implemented for its own 0.29
# KeyEvent), since Cargo can't unify a 0.x major-version bump on its own.
crossterm = "0.29.0"
pulldown-cmark = "0.13.4"
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "default-syntaxes", "default-themes", "regex-fancy"] }
# Loads real TextMate `.tmLanguage.json` grammars into `syntect`'s own
# `SyntaxDefinition` — see `crate::syntax_registry`. Depends on `syntect`
# with its `regex-onig` feature; Cargo unifies that into this binary's one
# `syntect` instance alongside the `regex-fancy` feature above (`onig` is
# already pulled in transitively via `edtui`, so this adds no new
# C-toolchain requirement).
syntect-tmlanguage = "0.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm"] }
# Already resolved transitively (headless_chrome's own dep chain) — pinned
# to the same 0.22.x here so the TUI's own `data:` image decoding
# (`tui::app::decode_data_url_image`) doesn't pull in a second copy.
base64 = "0.22"
edtui = "0.11.6"
open = "5"
self_update = { version = "0.44.0", default-features = false, features = ["ureq", "rustls", "archive-tar", "compression-flate2"] }
headless_chrome = { version = "1.0.22", features = ["fetch"] }
lopdf = "0.44.0"
# `node find`'s CSS-selector matching (see its own doc comment) — already a
# real dependency of `meshfox-server` (OpenGraph preview HTML parsing) and
# reachable from this binary either way (`meshfox-server` is a real
# dependency of this crate), so this promotion from the dev-only copy below
# adds no new transitive weight, just a second real use of what's already
# compiled in.
scraper = "0.20"
# `meshfox mcp` — an MCP stdio server exposing debug-session and
# canvas-editing tools to AI agents (see TODO.canvas.md's "MCP-сессия"/
# "MCP-редактирование файла" nodes). The official Rust SDK; `server` +
# `transport-io` cover the stdio tool server surface a host talks to.
# `client` + `transport-child-process` are for the *other* side of the same
# binary: `canvas_open` spawns `meshfox mcp <file>` per opened canvas and
# talks to it as an MCP client over its own stdio, keeping "one file, one
# process" isolation while still presenting one server to the host (see
# TODO.canvas.md's "Несколько канвасов в одном MCP-сервере?").
rmcp = { version = "3", features = ["server", "transport-io", "client", "transport-child-process"] }
schemars = "1"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
