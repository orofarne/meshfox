# Built-in theme after Everforest light (medium contrast): https://github.com/sainnhe/everforest

name = "everforest-light"
extends = "darkfox"

[ui]
accent = "#8da101"      # focused border, popups, selection fill
dep = "#df69ba"
fail = "#f85552"
ok = "#8da101"
border = "#939f91"
fg = "#5c6a72"
bg = "#fdf6e3"
