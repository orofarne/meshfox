[editor]
fg = "#f8f8f2"
bg = "#272822"
selection = "#49483e"
comment = "#90908a"
keyword = "#f92672"
string = "#e6db74"
number = "#ae81ff"
constant = "#ae81ff"
function = "#a6e22e"
type = "#66d9ef"
operator = "#f92672"
variable = "#fd971f"
