[package]
name = "meshfox-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
starlark = "0.14"
anyhow = "1"
pulldown-cmark = "0.12"
csv = "1.4.0"
serde_norway = "0.9.42"
toml = "0.8"
shlex = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"

# Linux Secret Service (gnome-keyring, KWallet, oo7-daemon, ...) for
# `secret_store = "keychain"`. No default features in 5.x: the pure-Rust
# crypto plus the async-io zbus runtime means no libdbus/openssl to link, and
# no tokio runtime for the blocking API to collide with.
[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "5.2", default-features = false, features = ["rt-async-io-crypto-rust"] }
