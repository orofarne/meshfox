# SonarCloud automatic analysis reads this file from the repo root.

# tree-sitter generated output (parser.c, tree_sitter/*.h) — regenerated by
# `tree-sitter generate` from grammar.js, so findings there are not actionable.
sonar.exclusions=editors/neovim/grammar/src/**

# The only Python in the repo is small examples/ scripts (run by whatever
# python3 the user has); pin the range Sonar assumes anyway.
sonar.python.version=3.10, 3.11, 3.12, 3.13, 3.14
