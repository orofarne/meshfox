<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1194" viewBox="0 0 1320 1194" role="img" aria-labelledby="title"><title id="title">Native canvas call — without a coordinator</title><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7" fill="#3974c6"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#f6f8fc"/><g font-family="Arial, sans-serif" fill="#192b43">
<text x="38" y="40" font-size="25" font-weight="bold">Native canvas call — without a coordinator</text>
<rect x="22.0" y="65" width="216" height="44" rx="9" fill="#e4edfc" stroke="#a9bddb"/><text x="130.0" y="93" text-anchor="middle" font-size="17" font-weight="bold">CLI / TUI / Browser</text><path d="M130.0 110V1025" stroke="#b0bfd1" stroke-dasharray="5 5"/>
<rect x="552.0" y="65" width="216" height="44" rx="9" fill="#e4edfc" stroke="#a9bddb"/><text x="660.0" y="93" text-anchor="middle" font-size="17" font-weight="bold">Parent worker</text><path d="M660.0 110V1025" stroke="#b0bfd1" stroke-dasharray="5 5"/>
<rect x="1082.0" y="65" width="216" height="44" rx="9" fill="#e4edfc" stroke="#a9bddb"/><text x="1190.0" y="93" text-anchor="middle" font-size="17" font-weight="bold">Child worker</text><path d="M1190.0 110V1025" stroke="#b0bfd1" stroke-dasharray="5 5"/>
<path d="M130.0 147H660.0" stroke="#3974c6" stroke-width="2" marker-end="url(#arrow)"/><text x="395.0" y="137" text-anchor="middle" font-size="15" paint-order="stroke" stroke="#f6f8fc" stroke-width="6" stroke-linejoin="round">Prepare parent application</text>
<rect x="548.0" y="184" width="224" height="33" rx="5" fill="#fff1cf"/><text x="660.0" y="205" text-anchor="middle" font-size="14">Check per-canvas worker lock</text>
<path d="M660.0 267H1190.0" stroke="#3974c6" stroke-width="2" marker-end="url(#arrow)"/><text x="925.0" y="257" text-anchor="middle" font-size="15" paint-order="stroke" stroke="#f6f8fc" stroke-width="6" stroke-linejoin="round">Reuse existing port OR start embedded worker</text>
<path d="M1190.0 327H660.0" stroke="#3974c6" stroke-width="2" marker-end="url(#arrow)"/><text x="925.0" y="317" text-anchor="middle" font-size="15" paint-order="stroke" stroke="#f6f8fc" stroke-width="6" stroke-linejoin="round">Ready: child worker port</text>
<path d="M660.0 387H1190.0" stroke="#3974c6" stroke-width="2" marker-end="url(#arrow)"/><text x="925.0" y="377" text-anchor="middle" font-size="15" paint-order="stroke" stroke="#f6f8fc" stroke-width="6" stroke-linejoin="round">Prepare child application; collect variables and confirmation gates</text>
<path d="M1190.0 447H660.0" stroke="#3974c6" stroke-width="2" marker-end="url(#arrow)"/><text x="925.0" y="437" text-anchor="middle" font-size="15" paint-order="stroke" stroke="#f6f8fc" stroke-width="6" stroke-linejoin="round">Prepared fields and gates (or validation error)</text>
<path d="M660.0 507H130.0" stroke="#3974c6" stroke-width="2" marker-end="url(#arrow)"/><text x="395.0" y="497" text-anchor="middle" font-size="15" paint-order="stroke" stroke="#f6f8fc" stroke-width="6" stroke-linejoin="round">Request missing input and approval, if needed</text>
<path d="M130.0 567H660.0" stroke="#3974c6" stroke-width="2" marker-end="url(#arrow)"/><text x="395.0" y="557" text-anchor="middle" font-size="15" paint-order="stroke" stroke="#f6f8fc" stroke-width="6" stroke-linejoin="round">Run with supplied values and approval</text>
<rect x="548.0" y="604" width="224" height="33" rx="5" fill="#fff1cf"/><text x="660.0" y="625" text-anchor="middle" font-size="14">Run parent dependencies</text>
<path d="M660.0 687H1190.0" stroke="#3974c6" stroke-width="2" marker-end="url(#arrow)"/><text x="925.0" y="677" text-anchor="middle" font-size="15" paint-order="stroke" stroke="#f6f8fc" stroke-width="6" stroke-linejoin="round">Run child application → child run ID</text>
<path d="M1190.0 747H660.0" stroke="#3974c6" stroke-width="2" marker-end="url(#arrow)"/><text x="925.0" y="737" text-anchor="middle" font-size="15" paint-order="stroke" stroke="#f6f8fc" stroke-width="6" stroke-linejoin="round">Stream child steps, output and final result</text>
<path d="M660.0 807H130.0" stroke="#3974c6" stroke-width="2" marker-end="url(#arrow)"/><text x="395.0" y="797" text-anchor="middle" font-size="15" paint-order="stroke" stroke="#f6f8fc" stroke-width="6" stroke-linejoin="round">Forward nested events and final result</text>
<path d="M130.0 867H660.0" stroke="#3974c6" stroke-width="2" marker-end="url(#arrow)"/><text x="395.0" y="857" text-anchor="middle" font-size="15" paint-order="stroke" stroke="#f6f8fc" stroke-width="6" stroke-linejoin="round">Cancel, if requested while running</text>
<path d="M660.0 927H1190.0" stroke="#3974c6" stroke-width="2" marker-end="url(#arrow)"/><text x="925.0" y="917" text-anchor="middle" font-size="15" paint-order="stroke" stroke="#f6f8fc" stroke-width="6" stroke-linejoin="round">Cancel exact child run ID</text>
<path d="M1190.0 987H660.0" stroke="#3974c6" stroke-width="2" marker-end="url(#arrow)"/><text x="925.0" y="977" text-anchor="middle" font-size="15" paint-order="stroke" stroke="#f6f8fc" stroke-width="6" stroke-linejoin="round">Terminal outcome; worker remains available</text>
<text x="38" y="1070" font-size="15" fill="#4a5f78">If no worker exists, the parent starts one on a separate thread and Tokio runtime in the same process.</text>
<text x="38" y="1098" font-size="15" fill="#4a5f78">An embedded worker shares the host process lifetime. Starting child services requires an independent worker.</text>
<text x="38" y="1126" font-size="15" fill="#4a5f78">Preparation completes before parent dependencies run. Cancellation is an alternative path during execution.</text>
</g></svg>