<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">A native call between two canvas workers</title>
<desc id="desc">The parent worker prepares the child before executing its own chain. The child worker returns input and confirmation requirements, then runs after approval and streams events. Cancellation targets the child run id. Only the outer client owns terminal status.</desc>
<defs>
 <marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9" fill="#2563eb"/></marker>
 <marker id="green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9" fill="#15803d"/></marker>
 <marker id="amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9" fill="#b45309"/></marker>
 <marker id="red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9" fill="#be123c"/></marker>
 <style>text{font-family:Arial,sans-serif;fill:#17243a}.heading{font-size:23px;font-weight:bold}.body{font-size:18px}.small{font-size:16px}.label{font-size:15px;font-weight:bold}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.wire{fill:none;stroke-width:2.5}</style>
</defs>
<rect width="1200" height="640" rx="20" fill="#f8fafc"/>
<text x="36" y="45" class="heading" font-size="28">A canvas calls another canvas</text>
<text x="36" y="75" class="body" fill="#526174">One terminal owner. Two execution contexts.</text>
<rect x="36" y="120" width="240" height="150" rx="14" class="box"/>
<text x="56" y="153" class="heading">CLI / TUI / browser</text>
<text x="56" y="187" class="body">Input and confirmation</text>
<text x="56" y="215" class="body">Live output and result</text>
<text x="56" y="245" class="small">Outer client owns tab status</text>
<rect x="350" y="120" width="280" height="350" rx="14" class="box"/>
<rect x="350" y="120" width="280" height="58" rx="14" fill="#e0ecff"/>
<text x="370" y="157" class="heading">Parent worker</text>
<text x="370" y="209" class="body">Parse meshfox YAML</text>
<text x="370" y="239" class="body">Resolve child canvas path</text>
<text x="370" y="269" class="body">Check child before starting</text>
<path d="M370 291H610" stroke="#cbd5e1"/>
<text x="370" y="322" class="body">Run own dependencies</text>
<text x="370" y="352" class="body">Invoke prepared child</text>
<text x="370" y="382" class="body">Retain nested output</text>
<text x="370" y="437" class="small">Own locks, history and cache</text>
<rect x="865" y="120" width="300" height="350" rx="14" class="box"/>
<rect x="865" y="120" width="300" height="58" rx="14" fill="#dcfce7"/>
<text x="885" y="157" class="heading">Child worker</text>
<text x="885" y="209" class="body">Resolve application + deps</text>
<text x="885" y="239" class="body">Check variables / approval</text>
<text x="885" y="269" class="body">Reject cycles and invalid calls</text>
<path d="M885 291H1145" stroke="#cbd5e1"/>
<text x="885" y="322" class="body">Run in the child's directory</text>
<text x="885" y="352" class="body">Use child freshness rules</text>
<text x="885" y="382" class="body">Stream steps and output</text>
<text x="885" y="437" class="small">Own locks, history and cache</text>
<path d="M276 194H341" class="wire" stroke="#2563eb" marker-end="url(#blue)"/>
<text x="290" y="180" class="label">run</text>
<path d="M630 212H856" class="wire" stroke="#2563eb" marker-end="url(#blue)"/>
<text x="657" y="200" class="label">1. prepare</text>
<path d="M865 267H639" class="wire" stroke="#b45309" marker-end="url(#amber)"/>
<text x="650" y="253" class="label">2. fields + approval gates</text>
<path d="M630 342H856" class="wire" stroke="#2563eb" marker-end="url(#blue)"/>
<text x="655" y="329" class="label">3. run after approval</text>
<path d="M865 402H639" class="wire" stroke="#15803d" marker-end="url(#green)"/>
<text x="653" y="389" class="label">4. events + exit status</text>
<path d="M156 270V508H470V479" class="wire" stroke="#be123c" stroke-dasharray="7 5" marker-end="url(#red)"/>
<text x="180" y="496" class="label" fill="#be123c">Cancel parent run</text>
<path d="M570 470V550H1010V479" class="wire" stroke="#be123c" stroke-dasharray="7 5" marker-end="url(#red)"/>
<text x="600" y="537" class="label" fill="#be123c">Parent forwards cancel to the exact child run id</text>
<text x="36" y="590" class="small">A coordinator reuses / starts the child worker. Without one, its lifetime belongs to the host process.</text>
<text x="36" y="615" class="small">Execution graphs stay separate; only requests, scoped input and events cross the boundary.</text>
</svg>
