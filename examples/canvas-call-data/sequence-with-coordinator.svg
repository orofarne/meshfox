<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1226" viewBox="0 0 1320 1226" role="img" aria-labelledby="title"><title id="title">Native canvas call — with a coordinator</title><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7" fill="#3974c6"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#f6f8fc"/><g font-family="Arial, sans-serif" fill="#192b43">
<text x="38" y="40" font-size="25" font-weight="bold">Native canvas call — with a coordinator</text>
<rect x="22.0" y="65" width="216" height="44" rx="9" fill="#e4edfc" stroke="#a9bddb"/><text x="130.0" y="93" text-anchor="middle" font-size="17" font-weight="bold">CLI / TUI / Browser</text><path d="M130.0 110V1085" stroke="#b0bfd1" stroke-dasharray="5 5"/>
<rect x="375.3333333333333" y="65" width="216" height="44" rx="9" fill="#e4edfc" stroke="#a9bddb"/><text x="483.3333333333333" y="93" text-anchor="middle" font-size="17" font-weight="bold">Parent worker</text><path d="M483.3333333333333 110V1085" stroke="#b0bfd1" stroke-dasharray="5 5"/>
<rect x="728.6666666666666" y="65" width="216" height="44" rx="9" fill="#e4edfc" stroke="#a9bddb"/><text x="836.6666666666666" y="93" text-anchor="middle" font-size="17" font-weight="bold">Coordinator</text><path d="M836.6666666666666 110V1085" stroke="#b0bfd1" stroke-dasharray="5 5"/>
<rect x="1082.0" y="65" width="216" height="44" rx="9" fill="#e4edfc" stroke="#a9bddb"/><text x="1190.0" y="93" text-anchor="middle" font-size="17" font-weight="bold">Child worker</text><path d="M1190.0 110V1085" stroke="#b0bfd1" stroke-dasharray="5 5"/>
<path d="M130.0 147H483.3333333333333" stroke="#3974c6" stroke-width="2" marker-end="url(#arrow)"/><text x="306.66666666666663" y="137" text-anchor="middle" font-size="15" paint-order="stroke" stroke="#f6f8fc" stroke-width="6" stroke-linejoin="round">Prepare parent application</text>
<path d="M483.3333333333333 207H836.6666666666666" stroke="#3974c6" stroke-width="2" marker-end="url(#arrow)"/><text x="660.0" y="197" text-anchor="middle" font-size="15" paint-order="stroke" stroke="#f6f8fc" stroke-width="6" stroke-linejoin="round">Get or start worker for child canvas</text>
<path d="M836.6666666666666 267H1190.0" stroke="#3974c6" stroke-width="2" marker-end="url(#arrow)"/><text x="1013.3333333333333" y="257" text-anchor="middle" font-size="15" paint-order="stroke" stroke="#f6f8fc" stroke-width="6" stroke-linejoin="round">Reuse worker, or launch worker process</text>
<path d="M1190.0 327H836.6666666666666" stroke="#3974c6" stroke-width="2" marker-end="url(#arrow)"/><text x="1013.3333333333333" y="317" text-anchor="middle" font-size="15" paint-order="stroke" stroke="#f6f8fc" stroke-width="6" stroke-linejoin="round">Ready: child worker port</text>
<path d="M836.6666666666666 387H483.3333333333333" stroke="#3974c6" stroke-width="2" marker-end="url(#arrow)"/><text x="660.0" y="377" text-anchor="middle" font-size="15" paint-order="stroke" stroke="#f6f8fc" stroke-width="6" stroke-linejoin="round">Return child worker port</text>
<path d="M483.3333333333333 447H1190.0" stroke="#3974c6" stroke-width="2" marker-end="url(#arrow)"/><text x="836.6666666666666" y="437" text-anchor="middle" font-size="15" paint-order="stroke" stroke="#f6f8fc" stroke-width="6" stroke-linejoin="round">Prepare child application; collect variables and confirmation gates</text>
<path d="M1190.0 507H483.3333333333333" stroke="#3974c6" stroke-width="2" marker-end="url(#arrow)"/><text x="836.6666666666666" y="497" text-anchor="middle" font-size="15" paint-order="stroke" stroke="#f6f8fc" stroke-width="6" stroke-linejoin="round">Prepared fields and gates (or validation error)</text>
<path d="M483.3333333333333 567H130.0" stroke="#3974c6" stroke-width="2" marker-end="url(#arrow)"/><text x="306.66666666666663" y="557" text-anchor="middle" font-size="15" paint-order="stroke" stroke="#f6f8fc" stroke-width="6" stroke-linejoin="round">Request missing input and approval, if needed</text>
<path d="M130.0 627H483.3333333333333" stroke="#3974c6" stroke-width="2" marker-end="url(#arrow)"/><text x="306.66666666666663" y="617" text-anchor="middle" font-size="15" paint-order="stroke" stroke="#f6f8fc" stroke-width="6" stroke-linejoin="round">Run with supplied values and approval</text>
<rect x="371.3333333333333" y="664" width="224" height="33" rx="5" fill="#fff1cf"/><text x="483.3333333333333" y="685" text-anchor="middle" font-size="14">Run parent dependencies</text>
<path d="M483.3333333333333 747H1190.0" stroke="#3974c6" stroke-width="2" marker-end="url(#arrow)"/><text x="836.6666666666666" y="737" text-anchor="middle" font-size="15" paint-order="stroke" stroke="#f6f8fc" stroke-width="6" stroke-linejoin="round">Run child application → child run ID</text>
<path d="M1190.0 807H483.3333333333333" stroke="#3974c6" stroke-width="2" marker-end="url(#arrow)"/><text x="836.6666666666666" y="797" text-anchor="middle" font-size="15" paint-order="stroke" stroke="#f6f8fc" stroke-width="6" stroke-linejoin="round">Stream child steps, output and final result</text>
<path d="M483.3333333333333 867H130.0" stroke="#3974c6" stroke-width="2" marker-end="url(#arrow)"/><text x="306.66666666666663" y="857" text-anchor="middle" font-size="15" paint-order="stroke" stroke="#f6f8fc" stroke-width="6" stroke-linejoin="round">Forward nested events and final result</text>
<path d="M130.0 927H483.3333333333333" stroke="#3974c6" stroke-width="2" marker-end="url(#arrow)"/><text x="306.66666666666663" y="917" text-anchor="middle" font-size="15" paint-order="stroke" stroke="#f6f8fc" stroke-width="6" stroke-linejoin="round">Cancel, if requested while running</text>
<path d="M483.3333333333333 987H1190.0" stroke="#3974c6" stroke-width="2" marker-end="url(#arrow)"/><text x="836.6666666666666" y="977" text-anchor="middle" font-size="15" paint-order="stroke" stroke="#f6f8fc" stroke-width="6" stroke-linejoin="round">Cancel exact child run ID</text>
<path d="M1190.0 1047H483.3333333333333" stroke="#3974c6" stroke-width="2" marker-end="url(#arrow)"/><text x="836.6666666666666" y="1037" text-anchor="middle" font-size="15" paint-order="stroke" stroke="#f6f8fc" stroke-width="6" stroke-linejoin="round">Terminal outcome; worker remains available</text>
<text x="38" y="1130" font-size="15" fill="#4a5f78">The coordinator owns worker creation. Parent and child retain separate canvas state and run histories.</text>
<text x="38" y="1158" font-size="15" fill="#4a5f78">Preparation completes before parent dependencies run. Cancellation is an alternative path during execution.</text>
</g></svg>